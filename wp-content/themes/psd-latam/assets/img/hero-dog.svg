  <!-- head -->
  <ellipse cx="120" cy="118" rx="66" ry="62" fill="#efd2a0"/>
  <!-- muzzle -->
  <ellipse cx="120" cy="150" rx="42" ry="34" fill="#f7e6c5"/>
